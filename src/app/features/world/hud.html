<div class="top-left">
  <div class="brand">
    <span class="logo">SM</span>
    <span class="name">{{ name }}</span>
  </div>
  <div class="progress" [attr.aria-label]="progress.count() + ' of ' + progress.total + ' sections discovered'">
    <span class="progress-label">Sections discovered</span>
    <span class="progress-count">{{ progress.count() }}/{{ progress.total }}</span>
    <div class="dots">
      @for (s of sections; track s.id) {
        <span class="dot" [class.on]="progress.discovered().includes(s.id)" [title]="s.label"></span>
      }
    </div>
  </div>
</div>

<div class="top-right">
  <button class="btn icon" (click)="audio.toggleMute()" [attr.aria-label]="audio.muted() ? 'Unmute' : 'Mute'">
    {{ audio.muted() ? '🔇' : '🔊' }}
  </button>
  <button class="btn icon" (click)="help.emit()" aria-label="Controls and menu">?</button>
  <button class="btn" (click)="switch2D.emit()">2D view</button>
</div>

<div class="crosshair" [class.active]="hoverLabel()"></div>

@if (hoverLabel(); as label) {
  <div class="prompt">
    @if (!touch()) {
      <kbd>E</kbd>
    }
    <span>{{ label }}</span>
  </div>
}

<svg class="minimap" [attr.viewBox]="-mapHalf - 1 + ' ' + (-mapHalf - 4) + ' ' + (mapHalf * 2 + 2) + ' ' + (mapHalf * 2 + 5)" aria-hidden="true">
  <rect [attr.x]="-mapHalf" [attr.y]="-mapHalf" [attr.width]="mapHalf * 2" [attr.height]="mapHalf * 2" rx="1.5" class="room" />
  @for (m of markers(); track m.id) {
    <g [attr.transform]="'translate(' + m.x + ' ' + m.z + ')'">
      <circle r="1.3" class="marker" [class.found]="progress.discovered().includes(m.id)" />
      <text
        [attr.y]="m.z < -10 ? -2.2 : 3.6"
        [attr.x]="m.x > 10 ? -1.6 : m.x < -10 ? 1.6 : 0"
        [attr.text-anchor]="m.x > 10 ? 'end' : m.x < -10 ? 'start' : 'middle'"
        class="marker-label"
      >{{ sectionLabel(m.id) }}</text>
    </g>
  }
  <g #player>
    <path d="M0,-1.8 L1.2,1.2 L0,0.5 L-1.2,1.2 Z" class="player" />
  </g>
</svg>
